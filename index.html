<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery | De Cero a Experto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">EN</div>
                <span>Mastery</span>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-section">
                    <span class="nav-label">Niveles de Escala</span>
                    <button class="nav-item active" data-level="all">Todo el Camino</button>
                    <button class="nav-item" data-level="a1a2">Principiante (A1-A2)</button>
                    <button class="nav-item" data-level="b1b2">Intermedio (B1-B2)</button>
                    <button class="nav-item" data-level="c1">Avanzado (C1)</button>
                    <button class="nav-item" data-level="c2">Maestría (C2)</button>
                </div>

                <div class="nav-section">
                    <span class="nav-label">Categorías</span>
                    <button class="cat-item active" data-cat="all">Todas las áreas</button>
                    <button class="cat-item" data-cat="grammar">Gramática</button>
                    <button class="cat-item" data-cat="vocab">Vocabulario</button>
                    <button class="cat-item" data-cat="listening">Listening</button>
                    <button class="cat-item" data-cat="speaking">Speaking</button>
                    <button class="cat-item" data-cat="reading">Reading</button>
                    <button class="cat-item" data-cat="writing">Writing</button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <p>Estado: <span class="status-dot"></span> Aprendiendo</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="main-header">
                <div class="header-text">
                    <h1>Domina el Inglés <span class="text-red">desde Cero</span></h1>
                    <p>Tu hoja de ruta definitiva hacia la fluidez total.</p>
                </div>
                <div class="user-badge">
                    <i data-lucide="user"></i>
                    <span>Estudiante</span>
                </div>
            </header>

            <div class="progress-banner">
                <div class="progress-info">
                    <span>Tu Progreso Global</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="main-progress"></div>
                </div>
            </div>

            <section class="grid-container" id="course-grid">
                <!-- Cards will be injected here by JS -->
            </section>
        </main>
    </div>

    <!-- Content Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title-area">
                    <span id="modal-level" class="modal-level">Principiante</span>
                    <h2 id="modal-title">Título de la Lección</h2>
                </div>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content injected here -->
            </div>
            <div class="modal-footer">
                <button class="complete-btn" id="complete-btn">Marcar como Completada</button>
            </div>
        </div>
    </div>

    <script src="content.js"></script>
    <script src="script.js"></script>    <script>
      lucide.createIcons();
    </script>
</body>
</html>
